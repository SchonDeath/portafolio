<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#04070f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />

    <!-- TODO: ajusta título y descripción a tu nombre y perfil -->
    <title>Sebastián González — Full-Stack Developer</title>
    <meta
      name="description"
      content="Sebastián González, desarrollador full-stack especializado en frontend. Proyectos para banca, seguros y sector público con Vue, TypeScript y Java."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sebastián González — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Interfaces y sistemas para banca, seguros y sector público. Conoce los proyectos y la experiencia de Sebastián González."
    />
    <!-- TODO: imagen social 1200×630px en /public/img/og.svg -->
    <meta property="og:image" content="/img/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tema, resuelto antes de la primera pintura.
         Va inline y sin defer a propósito: si esperara al bundle de Vue,
         el visitante en tema claro vería un fogonazo oscuro en cada carga. -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = saved || system
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
