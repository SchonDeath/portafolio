    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Dos familias: Space Grotesk para display, Fira para texto y
         metadatos. Manrope se eliminó en el rediseño — solapaba con Fira
         Sans sin aportar, y eran 4 pesos de descarga. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fira+Sans:ital,wght@0,350;0,400;0,500;1,400&family=Fira+Code:wght@400&display=swap"
      rel="stylesheet"
    />

    <!-- Tema, resuelto antes de la primera pintura.
         Va inline y sin defer a propósito: si esperara al bundle de Vue,
         el visitante en tema oscuro vería un fogonazo de papel claro en
         cada carga.

         El defecto es claro, no oscuro: el concepto del sitio es un
         documento impreso, y el papel es su estado natural. -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = saved || system
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
