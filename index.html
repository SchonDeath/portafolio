<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eeeae3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161917" />

    <title>Sebastián González — Desarrollador Full-Stack</title>
    <meta
      name="description"
      content="Sebastián González, desarrollador full-stack especializado en frontend. Sistemas para el Banco Central de Chile, Consorcio y el Servicio de Impuestos Internos."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sebastián González — Desarrollador Full-Stack" />
    <meta
      property="og:description"
      content="Interfaces y sistemas críticos para banca, seguros y sector público. Banco Central de Chile, Consorcio, Servicio de Impuestos Internos."
    />
    <!-- TODO: imagen social 1200×630px en /public/img/og.svg -->
    <meta property="og:image" content="/img/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Space Grotesk para display, Fira para texto y metadatos, y
         Newsreader como serif editorial: la voz de la portada y de los
         titulares de collage. Manrope se eliminó en el rediseño — solapaba
         con Fira Sans sin aportar. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,350;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Tema, resuelto antes de la primera pintura.
         Va inline y sin defer a propósito: si esperara al bundle de Vue,
         el visitante en tema oscuro vería un fogonazo de papel claro en
         cada carga.

         El defecto es claro, no oscuro: el concepto del sitio es un
         documento impreso, y el papel es su estado natural. -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = saved || system
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()

      // Pantalla de bienvenida. Se decide aquí, antes de pintar, por lo
      // mismo que el tema: si esperara a Vue, la portada completa se vería
      // un instante y luego se cerraría. Sale en cada carga, recargas
      // incluidas, salvo a quien llega con un ancla (#proyectos): ese
      // visitante ya sabe adónde va. Sin JS el atributo no existe y la
      // portada se ve entera.
      //
      // Una recarga (F5) siempre la muestra, aunque la dirección conserve
      // el #ancla del último enlace del índice: ahí el ancla la dejó el
      // propio visitante, no un enlace externo.
      ;(function () {
        var reload = false
        try {
          var nav = performance.getEntriesByType('navigation')[0]
          reload = !!nav && nav.type === 'reload'
        } catch (e) {}
        if (location.hash && !reload) return
        document.documentElement.setAttribute('data-intro', '')
        if (location.hash) history.replaceState(null, '', location.pathname + location.search)
        // El navegador restauraría el scroll de antes de recargar, y con la
        // página bloqueada la bienvenida quedaría fuera de la pantalla.
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
        window.scrollTo(0, 0)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
